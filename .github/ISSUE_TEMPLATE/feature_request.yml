name: 🚀 Feature Request
description: Propose a new backend feature, optimization, or architectural enhancement
title: "[FEATURE]: "
labels: ["enhancement", "backend"]
body:
  - type: markdown
    attributes:
      value: |
        Suggest an idea or enhancement for the Risala backend platform.
  - type: textarea
    id: problem
    attributes:
      label: Is your feature request related to a problem?
      description: A clear description of the business need or limitation.
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution / Architecture
      description: Describe the design, data model changes, or endpoints to be added.
    validations:
      required: true
  - type: textarea
    id: acceptance_criteria
    attributes:
      label: Acceptance Criteria
      description: What conditions must be met for this feature to be considered done?
      placeholder: |
        - [ ] Endpoint `/api/v1/...` implemented with Unit tests
        - [ ] Swagger / OpenAPI documentation updated
        - [ ] Permission check verified for USTAZ / STUDENT roles
    validations:
      required: true
