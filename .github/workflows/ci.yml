name: Enterprise Backend CI

env:
  DOCKER_BUILDKIT: 1
  COMPOSE_DOCKER_CLI_BUILD: 1

on:
  push:
    branches: ['master', 'main', 'staging']
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - '.gitignore'
  pull_request:
    branches: ['master', 'main', 'staging']
    paths-ignore:
      - 'docs/**'
      - '*.md'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  # ── STAGE 1: CODE QUALITY & SECURITY SCAN ──────────────────────────────────
  quality-and-security:
    name: Code Quality & Security Gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install Quality & Security Scanners
        run: |
          python -m pip install --upgrade pip
          pip install ruff flake8 bandit

      - name: Run Ruff Lint Checks
        run: |
          ruff check risala_backend/ config/ --ignore E501,F401,F403,F405 || true

      - name: Run Bandit Security Vulnerability Scan
        run: |
          # Scans for security holes, hardcoded credentials, and unsafe calls
          bandit -r risala_backend/ config/ -ll -ii || true

  # ── STAGE 2: DATABASE MIGRATIONS & TEST SUITE ──────────────────────────────
  test-and-migrations:
    name: Database Integrity & Pytest Suite
    runs-on: ubuntu-latest
    needs: [quality-and-security]

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Create Local Environment Files for CI
        run: |
          mkdir -p .envs/.local
          printf '%s\n' \
            "USE_DOCKER=yes" \
            "IPYTHONDIR=/app/.ipython" \
            "DJANGO_SETTINGS_MODULE=config.settings.local" \
            "DJANGO_SECRET_KEY=ci-local-testing-secret-key-123456789" \
            "DJANGO_ADMIN_URL=admin/" \
            "DJANGO_ALLOWED_HOSTS=localhost,127.0.0.1,0.0.0.0,django" \
            "DJANGO_READ_DOT_ENV_FILE=False" \
            "REDIS_URL=redis://redis:6379/0" \
            "CELERY_FLOWER_USER=debug" \
            "CELERY_FLOWER_PASSWORD=debug" \
            "ENABLE_SILK=false" \
            "PAYMENT_PROVIDER_DEFAULT=stripe" \
            "PAYMENT_DEFAULT_CURRENCY=usd" > .envs/.local/.django
          if [ ! -f .envs/.local/.postgres ]; then
            printf '%s\n' \
              "POSTGRES_HOST=postgres" \
              "POSTGRES_PORT=5432" \
              "POSTGRES_DB=risala_backend" \
              "POSTGRES_USER=debug" \
              "POSTGRES_PASSWORD=debug" \
              "DATABASE_URL=postgres://debug:debug@postgres:5432/risala_backend" > .envs/.local/.postgres
          fi

      - name: Build Django Local Image
        run: |
          docker compose -f docker-compose.local.yml build django

      - name: Verify No Missing Migrations
        run: |
          docker compose -f docker-compose.local.yml run --rm django python manage.py makemigrations --check --dry-run

      - name: Apply DB Migrations
        run: |
          docker compose -f docker-compose.local.yml run --rm django python manage.py migrate --noinput

      - name: Run Pytest Suite with Coverage
        run: |
          docker compose -f docker-compose.local.yml run --rm django pytest --durations=10

      - name: Tear down Services
        if: always()
        run: |
          docker compose -f docker-compose.local.yml down -v

  # ── STAGE 3: PRODUCTION DOCKER IMAGE VERIFICATION ──────────────────────────
  verify-production-build:
    name: Production Docker Build Gate
    runs-on: ubuntu-latest
    needs: [quality-and-security]

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate Production Dockerfile Build
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./compose/production/django/Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
