name: Backend CI

env:
  DOCKER_BUILDKIT: 1
  COMPOSE_DOCKER_CLI_BUILD: 1

on:
  push:
    branches: ['master', 'main']
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - '.gitignore'
  pull_request:
    branches: ['master', 'main']
    paths-ignore:
      - 'docs/**'
      - '*.md'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  lint-and-check:
    name: Code Quality & Django Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install Lint Tools
        run: |
          python -m pip install --upgrade pip
          pip install ruff flake8

      - name: Run Ruff Linter
        run: |
          ruff check risala_backend/ config/ --ignore E501,F401,F403,F405 || true

  test:
    name: Database Migrations & Pytest Suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Create Local Environment Files for CI
        run: |
          mkdir -p .envs/.local
          cat << 'EOF' > .envs/.local/.django
          USE_DOCKER=yes
          IPYTHONDIR=/app/.ipython
          DJANGO_SETTINGS_MODULE=config.settings.local
          DJANGO_SECRET_KEY=ci-local-testing-secret-key-123456789
          DJANGO_ADMIN_URL=admin/
          DJANGO_ALLOWED_HOSTS=localhost,127.0.0.1,0.0.0.0,django
          DJANGO_READ_DOT_ENV_FILE=False
          REDIS_URL=redis://redis:6379/0
          CELERY_FLOWER_USER=debug
          CELERY_FLOWER_PASSWORD=debug
          ENABLE_SILK=false
          PAYMENT_PROVIDER_DEFAULT=stripe
          PAYMENT_DEFAULT_CURRENCY=usd
          EOF
          if [ ! -f .envs/.local/.postgres ]; then
            cat << 'EOF' > .envs/.local/.postgres
            POSTGRES_HOST=postgres
            POSTGRES_PORT=5432
            POSTGRES_DB=risala_backend
            POSTGRES_USER=debug
            POSTGRES_PASSWORD=debug
            DATABASE_URL=postgres://debug:debug@postgres:5432/risala_backend
            EOF
          fi

      - name: Build Django Local Image
        run: |
          docker compose -f docker-compose.local.yml build django

      - name: Verify No Missing Migrations
        run: |
          docker compose -f docker-compose.local.yml run --rm django python manage.py makemigrations --check --dry-run

      - name: Apply DB Migrations
        run: |
          docker compose -f docker-compose.local.yml run --rm django python manage.py migrate --noinput

      - name: Run Django Tests
        run: |
          docker compose -f docker-compose.local.yml run --rm django pytest

      - name: Tear down Services
        if: always()
        run: |
          docker compose -f docker-compose.local.yml down -v
