name: Build and Push Docker Image to Docker Hub

on:
  push:
    branches: ['master']
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - '.gitignore'

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Verify Secret Detected
        run: |
          if [ -n "${{ secrets.DOCKERHUB_TOKEN || vars.DOCKERHUB_TOKEN || secrets.DOCKER_HUB_TOKEN || vars.DOCKER_HUB_TOKEN || secrets.DOCKER_PASSWORD || secrets.DOCKERHUB_PASSWORD || secrets.DOCKER_TOKEN || secrets.TOKEN }}" ]; then
            echo "Docker Hub password/token successfully detected!"
          else
            echo "ERROR: Docker Hub secret is empty. Check Repository Secrets in GitHub Settings."
          fi

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME || vars.DOCKERHUB_USERNAME || 'seud' }}
          password: ${{ secrets.DOCKERHUB_TOKEN || vars.DOCKERHUB_TOKEN || secrets.DOCKER_HUB_TOKEN || vars.DOCKER_HUB_TOKEN || secrets.DOCKER_PASSWORD || secrets.DOCKERHUB_PASSWORD || secrets.DOCKER_TOKEN || secrets.TOKEN }}

      - name: Build and Push Production Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./compose/production/django/Dockerfile
          push: true
          tags: seud/risala_backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
